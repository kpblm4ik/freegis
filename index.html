<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreeGIS — Конструктор инфраструктуры</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet"
      onerror="this.onerror=null;this.href='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css'">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d2530;
    --muted: #6b7686;
    --line: #e3e7ee;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: #e8ecf1; }
  #map { position: fixed; inset: 0; }
  #map.drawing, #map.drawing .maplibregl-canvas { cursor: crosshair; }

  #panel {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.18);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: grid; gap: 10px;
  }
  @media (min-width: 700px) {
    #panel { left: 12px; right: auto; bottom: auto; top: 12px; width: 330px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
  }
  h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  .types { display: flex; gap: 6px; flex-wrap: wrap; }
  .type {
    flex: 1 1 auto; border: 1.5px solid var(--line); background: #fff; color: var(--fg);
    border-radius: 10px; padding: 8px 10px; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .type i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .type.active { border-color: var(--accent); background: #eff4ff; font-weight: 600; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #breakdown { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  .actions { display: flex; gap: 8px; }
  button.btn {
    flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button.btn.secondary { background: #eef1f6; color: var(--fg); }
  button.btn.danger { background: #fee2e2; color: var(--danger); }
  button.btn.on { background: #16a34a; }
  button.btn:disabled { opacity: .45; cursor: default; }
  #hint { font-size: 12px; color: var(--muted); min-height: 16px; }
  #status { font-size: 12px; color: var(--danger); }
  #status:empty { display: none; }
  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-top-right { z-index: 1; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div>
    <h4>Транспорт</h4>
    <div class="types" id="types"></div>
  </div>
  <div class="stats">
    <div class="stat"><h4>Длина</h4><b id="len">0.00 км</b></div>
    <div class="stat"><h4>Стоимость</h4><b id="cost">0 млн ₽</b></div>
  </div>
  <div id="breakdown"></div>
  <div id="hint"></div>
  <div id="status"></div>
  <div class="actions">
    <button class="btn" id="draw">Проложить</button>
    <button class="btn secondary" id="undo" title="Убрать последнюю точку">↶</button>
    <button class="btn danger" id="reset">Сброс</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Настройки ----------
  // Стоимость строительства, млн ₽ за 1 км. Меняйте под себя.
  var TYPES = {
    road: { name: 'Автодорога (2 полосы)', color: '#f5b301', casing: '#6b5200', costPerKm: 60 },
    tram: { name: 'Трамвай',               color: '#e53935', casing: '#ffffff', costPerKm: 250 },
    rail: { name: 'ЖД путь',               color: '#3a3f47', casing: '#ffffff', costPerKm: 150 }
  };
  var STORAGE_KEY = 'freegis.v1';
  // OpenFreeMap: liberty | bright | positron
  var STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';

  // Автопереход на Яндекс Карты (yandex.html), если основная карта не загрузилась за FALLBACK_MS.
  // Включайте (true) только после того, как в yandex.html вписан API-ключ.
  // Построенные линии не теряются: обе страницы читают одно и то же сохранение.
  var YANDEX_FALLBACK = false;
  var YANDEX_URL = 'yandex.html';
  var FALLBACK_MS = 5000;

  // Запасная подложка OSM (работает, пока YANDEX_FALLBACK выключен)
  var FALLBACK_STYLE = {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        maxzoom: 19,
        attribution: '© OpenStreetMap contributors'
      }
    },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  };
  // Скрипт MapLibre: основной CDN и запасной (версия зафиксирована)
  var JS_URLS = [
    'https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js',
    'https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js'
  ];

  // ---------- Состояние ----------
  var state = {
    type: 'road',
    drawing: false,
    lines: [],                 // завершённые: {type, coords:[[lng,lat],...]}
    cur: { type: 'road', coords: [] },
    cursor: null
  };

  // ---------- Геометрия ----------
  function haversineKm(a, b) {
    var R = 6371.0088, toRad = Math.PI / 180;
    var dLat = (b[1] - a[1]) * toRad, dLng = (b[0] - a[0]) * toRad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a[1] * toRad) * Math.cos(b[1] * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function lineLengthKm(coords) {
    var sum = 0;
    for (var i = 1; i < coords.length; i++) sum += haversineKm(coords[i - 1], coords[i]);
    return sum;
  }
  function allLines() {
    var res = state.lines.slice();
    if (state.cur.coords.length) res.push(state.cur);
    return res;
  }
  function totals() {
    var byType = {}, len = 0, cost = 0;
    Object.keys(TYPES).forEach(function (k) { byType[k] = { km: 0, cost: 0 }; });
    allLines().forEach(function (l) {
      var km = lineLengthKm(l.coords), c = km * TYPES[l.type].costPerKm;
      byType[l.type].km += km; byType[l.type].cost += c;
      len += km; cost += c;
    });
    return { len: len, cost: cost, byType: byType };
  }

  // ---------- UI ----------
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n, d) { return n.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  function setStatus(msg) { $('status').textContent = msg || ''; }

  function buildTypeButtons() {
    var box = $('types');
    box.innerHTML = '';
    Object.keys(TYPES).forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'type' + (k === state.type ? ' active' : '');
      b.type = 'button';
      b.innerHTML = '<i style="background:' + TYPES[k].color + '"></i>' + TYPES[k].name;
      b.onclick = function () { setType(k); };
      box.appendChild(b);
    });
  }

  function setType(k) {
    // если рисуем и тип сменился — закрываем текущую линию, начинаем новую
    if (state.drawing && state.cur.coords.length >= 2 && state.cur.type !== k) commitCurrent();
    state.type = k;
    state.cur.type = k;
    buildTypeButtons();
    refresh();
  }

  function updateHint() {
    var h = '';
    if (state.drawing) {
      h = state.cur.coords.length
        ? 'Тапайте по карте, чтобы добавить точки. «Готово» — завершить линию.'
        : 'Тапните по карте, чтобы поставить первую точку.';
    } else if (!allLines().length) {
      h = 'Выберите тип и нажмите «Проложить».';
    }
    $('hint').textContent = h;
  }

  function updateStats() {
    var t = totals();
    $('len').textContent = fmt(t.len, 2) + ' км';
    $('cost').textContent = t.cost > 0 && t.cost < 1
      ? fmt(Math.round(t.cost * 1000), 0) + ' тыс. ₽'
      : fmt(t.cost, t.cost < 100 ? 1 : 0) + ' млн ₽';
    var parts = [];
    Object.keys(TYPES).forEach(function (k) {
      if (t.byType[k].km > 0) parts.push(TYPES[k].name + ': ' + fmt(t.byType[k].km, 2) + ' км · ' + fmt(t.byType[k].cost, 1) + ' млн ₽');
    });
    $('breakdown').innerHTML = parts.join('<br>');
  }

  function updateButtons() {
    var d = $('draw');
    d.textContent = state.drawing ? 'Готово' : 'Проложить';
    d.classList.toggle('on', state.drawing);
    $('undo').disabled = !(state.cur.coords.length || state.lines.length);
    $('reset').disabled = !(state.cur.coords.length || state.lines.length);
    $('map').classList.toggle('drawing', state.drawing);
  }

  // ---------- Данные карты ----------
  var map;
  var ready = false;      // стиль загружен, слои добавлены
  var loaded = false;     // карта полностью загрузилась (стиль + первые тайлы)
  var usingFallback = false;
  var firstFit = true;

  function lineFeatures() {
    var f = [];
    allLines().forEach(function (l) {
      if (l.coords.length >= 2) f.push({ type: 'Feature', properties: { kind: l.type }, geometry: { type: 'LineString', coordinates: l.coords } });
    });
    return { type: 'FeatureCollection', features: f };
  }
  function pointFeatures() {
    var f = [];
    state.lines.forEach(function (l) {
      l.coords.forEach(function (c, i) {
        var end = i === 0 || i === l.coords.length - 1;
        f.push({ type: 'Feature', properties: { end: end, active: false }, geometry: { type: 'Point', coordinates: c } });
      });
    });
    state.cur.coords.forEach(function (c) {
      f.push({ type: 'Feature', properties: { end: true, active: true }, geometry: { type: 'Point', coordinates: c } });
    });
    return { type: 'FeatureCollection', features: f };
  }
  function previewFeature() {
    var c = state.cur.coords, f = [];
    if (state.drawing && state.cursor && c.length) {
      f.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [c[c.length - 1], state.cursor] } });
    }
    return { type: 'FeatureCollection', features: f };
  }

  function render() {
    if (!ready) return;
    var a = map.getSource('fg-lines'), b = map.getSource('fg-points'), c = map.getSource('fg-preview');
    if (!a || !b || !c) return;
    a.setData(lineFeatures());
    b.setData(pointFeatures());
    c.setData(previewFeature());
  }

  function addLayers() {
    ['fg-lines', 'fg-points', 'fg-preview'].forEach(function (id) {
      if (!map.getSource(id)) map.addSource(id, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    });
    if (map.getLayer('fg-points')) return; // слои уже добавлены
    var widthExpr = function (a, b, c) { return ['interpolate', ['linear'], ['zoom'], 8, a, 14, b, 18, c]; };
    var isK = function (k) { return ['==', ['get', 'kind'], k]; };

    // Автодорога
    map.addLayer({ id: 'fg-road-casing', type: 'line', source: 'fg-lines', filter: isK('road'),
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': TYPES.road.casing, 'line-width': widthExpr(4, 9, 22) } });
    map.addLayer({ id: 'fg-road', type: 'line', source: 'fg-lines', filter: isK('road'),
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': TYPES.road.color, 'line-width': widthExpr(2.5, 6, 18) } });
    map.addLayer({ id: 'fg-road-center', type: 'line', source: 'fg-lines', filter: isK('road'),
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': widthExpr(0.5, 1, 2), 'line-dasharray': [3, 3] } });

    // Трамвай
    map.addLayer({ id: 'fg-tram-casing', type: 'line', source: 'fg-lines', filter: isK('tram'),
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': TYPES.tram.casing, 'line-width': widthExpr(4, 6.5, 12) } });
    map.addLayer({ id: 'fg-tram', type: 'line', source: 'fg-lines', filter: isK('tram'),
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': TYPES.tram.color, 'line-width': widthExpr(2, 3.5, 7) } });

    // ЖД
    map.addLayer({ id: 'fg-rail-base', type: 'line', source: 'fg-lines', filter: isK('rail'),
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': TYPES.rail.color, 'line-width': widthExpr(3, 5, 9) } });
    map.addLayer({ id: 'fg-rail-dash', type: 'line', source: 'fg-lines', filter: isK('rail'),
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': widthExpr(1.5, 2.5, 5), 'line-dasharray': [2, 2] } });

    // Предпросмотр сегмента до курсора
    map.addLayer({ id: 'fg-preview', type: 'line', source: 'fg-preview',
      paint: { 'line-color': '#2563eb', 'line-width': 2, 'line-dasharray': [2, 2] } });

    // Вершины
    map.addLayer({ id: 'fg-points', type: 'circle', source: 'fg-points',
      paint: {
        'circle-radius': ['case', ['get', 'active'], 6, ['get', 'end'], 4, 2.5],
        'circle-color': ['case', ['get', 'active'], '#2563eb', '#ffffff'],
        'circle-stroke-color': '#1d2530',
        'circle-stroke-width': 1.5
      } });
  }

  // ---------- Действия ----------
  function commitCurrent() {
    if (state.cur.coords.length >= 2) state.lines.push({ type: state.cur.type, coords: state.cur.coords.slice() });
    state.cur = { type: state.type, coords: [] };
  }

  function toggleDrawing() {
    if (state.drawing) {
      commitCurrent();
      state.drawing = false;
      state.cursor = null;
    } else {
      state.drawing = true;
      state.cur = { type: state.type, coords: [] };
    }
    refresh();
  }

  function undo() {
    if (state.cur.coords.length) {
      state.cur.coords.pop();
    } else if (state.lines.length) {
      var last = state.lines.pop();
      // возвращаем линию в редактирование, чтобы убирать точки по одной
      if (state.drawing) { state.cur = { type: last.type, coords: last.coords.slice(0, -1) }; state.type = last.type; buildTypeButtons(); }
    }
    refresh();
  }

  function resetAll() {
    if ((state.lines.length || state.cur.coords.length) && !confirm('Удалить все построенные объекты?')) return;
    state.lines = [];
    state.cur = { type: state.type, coords: [] };
    state.drawing = false;
    state.cursor = null;
    refresh();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.lines.concat(state.cur.coords.length >= 2 ? [state.cur] : []))); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        state.lines = arr.filter(function (l) { return l && TYPES[l.type] && Array.isArray(l.coords) && l.coords.length >= 2; });
      }
    } catch (e) {}
  }

  function refresh() {
    render();
    updateStats();
    updateButtons();
    updateHint();
    save();
  }

  // ---------- Запасные варианты ----------
  // Переход на Яндекс Карты. Возвращает true, если переход начался.
  function goYandex(reason) {
    if (!YANDEX_FALLBACK) return false;
    console.warn('FreeGIS: основная карта недоступна, открываю Яндекс Карты —', reason);
    save();
    location.replace(YANDEX_URL);
    return true;
  }

  function switchToFallback(reason) {
    if (usingFallback || !map) return;
    usingFallback = true;
    console.warn('FreeGIS: переключаюсь на запасную подложку —', reason);
    setStatus('Основной стиль карты недоступен, включена запасная подложка OSM.');
    try { map.setStyle(FALLBACK_STYLE); } catch (e) { setStatus('Не удалось загрузить карту: ' + (e && e.message || e)); }
  }

  // ---------- Карта ----------
  function initMap() {
    try {
      map = new maplibregl.Map({
        container: 'map',
        style: STYLE_URL,
        center: [37.62, 55.75],
        zoom: 10,
        maxZoom: 19,
        attributionControl: { compact: true }
      });
    } catch (e) {
      // чаще всего — отключён WebGL / аппаратное ускорение; Яндекс Карты работают и без него
      if (goYandex('MapLibre не запустился: ' + (e && e.message || e))) return;
      setStatus('Карта не запустилась: ' + (e && e.message || e) + '. Проверьте, включён ли WebGL в браузере.');
      return;
    }
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

    // style.load срабатывает и после смены стиля — слои добавляются заново
    map.on('style.load', function () {
      addLayers();
      ready = true;
      refresh();
      if (firstFit) {
        firstFit = false;
        // подогнать вид под сохранённые объекты
        var pts = [];
        state.lines.forEach(function (l) { pts = pts.concat(l.coords); });
        if (pts.length) {
          var b = new maplibregl.LngLatBounds(pts[0], pts[0]);
          pts.forEach(function (p) { b.extend(p); });
          map.fitBounds(b, { padding: 80, duration: 0, maxZoom: 15 });
        }
      }
    });

    // 'load' — стиль и первые тайлы реально пришли
    map.on('load', function () { loaded = true; });

    if (YANDEX_FALLBACK) {
      // не загрузилась за FALLBACK_MS — уходим на Яндекс Карты
      setTimeout(function () { if (!loaded) goYandex('таймаут ' + FALLBACK_MS + ' мс'); }, FALLBACK_MS);
    } else {
      // если стиль не загрузился за 8 секунд — запасная подложка OSM
      setTimeout(function () { if (!ready) switchToFallback('таймаут загрузки стиля'); }, 8000);
    }

    map.on('click', function (e) {
      if (!state.drawing) return;
      state.cur.type = state.type;
      state.cur.coords.push([e.lngLat.lng, e.lngLat.lat]);
      refresh();
    });
    map.on('mousemove', function (e) {
      if (!state.drawing || !state.cur.coords.length) return;
      state.cursor = [e.lngLat.lng, e.lngLat.lat];
      render();
    });
    map.on('dblclick', function (e) {
      if (state.drawing) e.preventDefault();
    });
    map.on('error', function (e) {
      var msg = e && e.error && (e.error.message || String(e.error)) || 'unknown';
      console.warn('map error:', msg);
      // ошибка самого стиля (до его загрузки) — запасная подложка OSM.
      // При включённом переходе на Яндекс решает таймер выше.
      if (!ready && !YANDEX_FALLBACK) switchToFallback(msg);
    });
  }

  // ---------- Загрузка MapLibre с запасным CDN ----------
  function loadScript(urls, done) {
    var i = 0;
    (function next() {
      if (i >= urls.length) return done(false);
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function () { done(true); };
      s.onerror = function () { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  }

  // ---------- Старт ----------
  $('draw').onclick = toggleDrawing;
  $('undo').onclick = undo;
  $('reset').onclick = resetAll;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.drawing) toggleDrawing();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });

  load();
  buildTypeButtons();
  updateStats();
  updateButtons();
  updateHint();

  if (window.maplibregl) initMap();
  else loadScript(JS_URLS, function (ok) {
    if (ok && window.maplibregl) initMap();
    else if (!goYandex('не загрузился скрипт MapLibre')) setStatus('Не удалось загрузить MapLibre GL ни с одного CDN. Проверьте интернет или отключите блокировщики.');
  });
})();
</script>
</body>
</html>
