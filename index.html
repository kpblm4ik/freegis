<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreeGIS — Конструктор инфраструктуры</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d2530;
    --muted: #6b7686;
    --line: #e3e7ee;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  #map { position: fixed; inset: 0; }
  #map.drawing, #map.drawing .maplibregl-canvas { cursor: crosshair; }

  #panel {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.18);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: grid; gap: 10px;
  }
  @media (min-width: 700px) {
    #panel { left: 12px; right: auto; bottom: auto; top: 12px; width: 330px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
  }
