<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreeGIS (Яндекс Карты) — Конструктор инфраструктуры</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d2530;
    --muted: #6b7686;
    --line: #e3e7ee;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: #e8ecf1; }
  #map { position: fixed; left: 0; right: 0; top: 0; bottom: 0; }

  #panel {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.18);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: grid; gap: 10px;
  }
  @media (min-width: 700px) {
    #panel { left: 12px; right: auto; bottom: auto; top: 12px; width: 330px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
  }
  h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  .types { display: flex; gap: 6px; flex-wrap: wrap; }
  .type {
    flex: 1 1 auto; border: 1.5px solid var(--line); background: #fff; color: var(--fg);
    border-radius: 10px; padding: 8px 10px; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .type i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .type.active { border-color: var(--accent); background: #eff4ff; font-weight: 600; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #breakdown { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  .actions { display: flex; gap: 8px; }
  button.btn {
    flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button.btn.secondary { background: #eef1f6; color: var(--fg); }
  button.btn.danger { background: #fee2e2; color: var(--danger); }
  button.btn.on { background: #16a34a; }
  button.btn:disabled { opacity: .45; cursor: default; }
  #hint { font-size: 12px; color: var(--muted); min-height: 16px; }
  #status { font-size: 12px; color: var(--danger); }
  #status:empty { display: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div>
    <h4>Транспорт</h4>
    <div class="types" id="types"></div>
  </div>
  <div class="stats">
    <div class="stat"><h4>Длина</h4><b id="len">0.00 км</b></div>
    <div class="stat"><h4>Стоимость</h4><b id="cost">0 млн ₽</b></div>
  </div>
  <div id="breakdown"></div>
  <div id="hint"></div>
  <div id="status"></div>
  <div class="actions">
    <button class="btn" id="draw">Проложить</button>
    <button class="btn secondary" id="undo" title="Убрать последнюю точку">↶</button>
    <button class="btn danger" id="reset">Сброс</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Настройки ----------
  // API-ключ Яндекс Карт (JavaScript API). Получить: developer.tech.yandex.ru
  // Ключ в браузерном коде публичный — ограничьте его по HTTP Referer: kpblm4ik.github.io
  var YA_KEY = 'ВСТАВЬ_КЛЮЧ_СЮДА';

  // Стоимость строительства, млн ₽ за 1 км. Меняйте под себя.
  var TYPES = {
    road: { name: 'Автодорога (2 полосы)', color: '#f5b301', casing: '#6b5200', costPerKm: 60 },
    tram: { name: 'Трамвай',               color: '#e53935', casing: '#ffffff', costPerKm: 250 },
    rail: { name: 'ЖД путь',               color: '#3a3f47', casing: '#ffffff', costPerKm: 150 }
  };
  var STORAGE_KEY = 'freegis.v1'; // тот же формат, что и в основной версии: coords = [lng, lat]

  // ---------- Состояние ----------
  var state = {
    type: 'road',
    drawing: false,
    lines: [],                 // завершённые: {type, coords:[[lng,lat],...]}
    cur: { type: 'road', coords: [] },
    cursor: null               // [lng, lat]
  };

  // ---------- Геометрия ----------
  function haversineKm(a, b) {
    var R = 6371.0088, toRad = Math.PI / 180;
    var dLat = (b[1] - a[1]) * toRad, dLng = (b[0] - a[0]) * toRad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a[1] * toRad) * Math.cos(b[1] * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function lineLengthKm(coords) {
    var sum = 0;
    for (var i = 1; i < coords.length; i++) sum += haversineKm(coords[i - 1], coords[i]);
    return sum;
  }
  function allLines() {
    var res = state.lines.slice();
    if (state.cur.coords.length) res.push(state.cur);
    return res;
  }
  function totals() {
    var byType = {}, len = 0, cost = 0;
    Object.keys(TYPES).forEach(function (k) { byType[k] = { km: 0, cost: 0 }; });
    allLines().forEach(function (l) {
      var km = lineLengthKm(l.coords), c = km * TYPES[l.type].costPerKm;
      byType[l.type].km += km; byType[l.type].cost += c;
      len += km; cost += c;
    });
    return { len: len, cost: cost, byType: byType };
  }
  // Яндекс ждёт [широта, долгота]
  function toYa(c) { return [c[1], c[0]]; }

  // ---------- UI ----------
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n, d) { return n.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  function setStatus(msg) { $('status').textContent = msg || ''; }

  function buildTypeButtons() {
    var box = $('types');
    box.innerHTML = '';
    Object.keys(TYPES).forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'type' + (k === state.type ? ' active' : '');
      b.type = 'button';
      b.innerHTML = '<i style="background:' + TYPES[k].color + '"></i>' + TYPES[k].name;
      b.onclick = function () { setType(k); };
      box.appendChild(b);
    });
  }

  function setType(k) {
    if (state.drawing && state.cur.coords.length >= 2 && state.cur.type !== k) commitCurrent();
    state.type = k;
    state.cur.type = k;
    buildTypeButtons();
    refresh();
  }

  function updateHint() {
    var h = '';
    if (state.drawing) {
      h = state.cur.coords.length
        ? 'Тапайте по карте, чтобы добавить точки. «Готово» — завершить линию.'
        : 'Тапните по карте, чтобы поставить первую точку.';
    } else if (!allLines().length) {
      h = 'Выберите тип и нажмите «Проложить».';
    }
    $('hint').textContent = h;
  }

  function updateStats() {
    var t = totals();
    $('len').textContent = fmt(t.len, 2) + ' км';
    $('cost').textContent = t.cost > 0 && t.cost < 1
      ? fmt(Math.round(t.cost * 1000), 0) + ' тыс. ₽'
      : fmt(t.cost, t.cost < 100 ? 1 : 0) + ' млн ₽';
    var parts = [];
    Object.keys(TYPES).forEach(function (k) {
      if (t.byType[k].km > 0) parts.push(TYPES[k].name + ': ' + fmt(t.byType[k].km, 2) + ' км · ' + fmt(t.byType[k].cost, 1) + ' млн ₽');
    });
    $('breakdown').innerHTML = parts.join('<br>');
  }

  var crossCursor = null;
  function updateButtons() {
    var d = $('draw');
    d.textContent = state.drawing ? 'Готово' : 'Проложить';
    d.classList.toggle('on', state.drawing);
    $('undo').disabled = !(state.cur.coords.length || state.lines.length);
    $('reset').disabled = !(state.cur.coords.length || state.lines.length);
    if (map) {
      if (state.drawing) {
        map.behaviors.disable('dblClickZoom');
        if (!crossCursor) crossCursor = map.cursors.push('crosshair');
      } else {
        map.behaviors.enable('dblClickZoom');
        if (crossCursor) { crossCursor.remove(); crossCursor = null; }
      }
    }
  }

  // На телефоне панель снизу не должна закрывать логотип и копирайт Яндекса:
  // карта заканчивается там, где начинается панель.
  function layoutMap() {
    var mapEl = $('map'), panel = $('panel');
    mapEl.style.bottom = (window.innerWidth < 700 ? panel.offsetHeight : 0) + 'px';
    if (map) map.container.fitToViewport();
  }

  // ---------- Карта ----------
  var map = null, layer = null, ready = false;

  function line(coords, color, width, dash) {
    var opts = { strokeColor: color, strokeWidth: width, strokeOpacity: 1, interactivityModel: 'default#transparent' };
    if (dash) opts.strokeStyle = dash;
    layer.add(new ymaps.Polyline(coords, {}, opts));
  }

  function drawLine(coords, type) {
    if (type === 'road') {
      line(coords, TYPES.road.casing, 9);
      line(coords, TYPES.road.color, 6);
      line(coords, '#ffffff', 1, 'dash');
    } else if (type === 'tram') {
      line(coords, TYPES.tram.casing, 7);
      line(coords, TYPES.tram.color, 4);
    } else {
      line(coords, TYPES.rail.color, 5);
      line(coords, '#ffffff', 2, 'dash');
    }
  }

  function dot(c, color) {
    layer.add(new ymaps.Placemark(toYa(c), {}, {
      preset: 'islands#circleDotIcon',
      iconColor: color,
      interactivityModel: 'default#transparent'
    }));
  }

  function render() {
    if (!ready) return;
    layer.removeAll();
    allLines().forEach(function (l) {
      if (l.coords.length >= 2) drawLine(l.coords.map(toYa), l.type);
    });
    // концы завершённых линий
    state.lines.forEach(function (l) {
      dot(l.coords[0], '#1d2530');
      dot(l.coords[l.coords.length - 1], '#1d2530');
    });
    // точки текущей линии
    state.cur.coords.forEach(function (c) { dot(c, '#2563eb'); });
    // отрезок от последней точки до курсора
    var c = state.cur.coords;
    if (state.drawing && state.cursor && c.length) {
      line([toYa(c[c.length - 1]), toYa(state.cursor)], '#2563eb', 2, 'dash');
    }
  }

  // ---------- Действия ----------
  function commitCurrent() {
    if (state.cur.coords.length >= 2) state.lines.push({ type: state.cur.type, coords: state.cur.coords.slice() });
    state.cur = { type: state.type, coords: [] };
  }

  function toggleDrawing() {
    if (state.drawing) {
      commitCurrent();
      state.drawing = false;
      state.cursor = null;
    } else {
      state.drawing = true;
      state.cur = { type: state.type, coords: [] };
    }
    refresh();
  }

  function undo() {
    if (state.cur.coords.length) {
      state.cur.coords.pop();
    } else if (state.lines.length) {
      var last = state.lines.pop();
      if (state.drawing) { state.cur = { type: last.type, coords: last.coords.slice(0, -1) }; state.type = last.type; buildTypeButtons(); }
    }
    refresh();
  }

  function resetAll() {
    if ((state.lines.length || state.cur.coords.length) && !confirm('Удалить все построенные объекты?')) return;
    state.lines = [];
    state.cur = { type: state.type, coords: [] };
    state.drawing = false;
    state.cursor = null;
    refresh();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.lines.concat(state.cur.coords.length >= 2 ? [state.cur] : []))); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        state.lines = arr.filter(function (l) { return l && TYPES[l.type] && Array.isArray(l.coords) && l.coords.length >= 2; });
      }
    } catch (e) {}
  }

  function refresh() {
    render();
    updateStats();
    updateButtons();
    updateHint();
    layoutMap();
    save();
  }

  // ---------- Инициализация карты ----------
  function initMap() {
    try {
      map = new ymaps.Map('map', {
        center: [55.75, 37.62],
        zoom: 10,
        controls: ['zoomControl']
      });
    } catch (e) {
      setStatus('Карта не запустилась: ' + (e && e.message || e));
      return;
    }
    layer = new ymaps.GeoObjectCollection();
    map.geoObjects.add(layer);
    ready = true;

    map.events.add('click', function (e) {
      if (!state.drawing) return;
      var p = e.get('coords'); // [lat, lng]
      state.cur.type = state.type;
      state.cur.coords.push([p[1], p[0]]);
      refresh();
    });
    map.events.add('mousemove', function (e) {
      if (!state.drawing || !state.cur.coords.length) return;
      var p = e.get('coords');
      state.cursor = [p[1], p[0]];
      render();
    });

    layoutMap();
    refresh();

    // подогнать вид под сохранённые объекты
    var pts = [];
    state.lines.forEach(function (l) { pts = pts.concat(l.coords); });
    if (pts.length) {
      var minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
      pts.forEach(function (p) {
        if (p[1] < minLat) minLat = p[1]; if (p[1] > maxLat) maxLat = p[1];
        if (p[0] < minLng) minLng = p[0]; if (p[0] > maxLng) maxLng = p[0];
      });
      map.setBounds([[minLat, minLng], [maxLat, maxLng]], { checkZoomRange: true, zoomMargin: 80 });
    }
  }

  // ---------- Старт ----------
  $('draw').onclick = toggleDrawing;
  $('undo').onclick = undo;
  $('reset').onclick = resetAll;
  window.addEventListener('resize', layoutMap);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.drawing) toggleDrawing();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });

  load();
  buildTypeButtons();
  updateStats();
  updateButtons();
  updateHint();
  layoutMap();

  if (!YA_KEY || YA_KEY.indexOf('ВСТАВЬ') === 0) {
    setStatus('Нужен API-ключ Яндекс Карт: впишите его в константу YA_KEY в начале скрипта.');
    return;
  }

  var s = document.createElement('script');
  s.src = 'https://api-maps.yandex.ru/2.1/?apikey=' + encodeURIComponent(YA_KEY) + '&lang=ru_RU';
  s.onload = function () {
    if (window.ymaps) ymaps.ready(initMap);
    else setStatus('Яндекс Карты не инициализировались. Проверьте ключ и его ограничения по домену.');
  };
  s.onerror = function () { setStatus('Не удалось загрузить API Яндекс Карт. Проверьте интернет или отключите блокировщики.'); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
