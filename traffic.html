<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreeGIS — Пробки и симуляция (Яндекс Карты)</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#1d2530; background:#e8ecf1; }
  #map { position:fixed; left:0; right:0; top:0; bottom:0; }
  #p { position:fixed; z-index:5; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.2);
       padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:grid; gap:8px; }
  @media (min-width:700px) { #p { left:12px; right:auto; bottom:auto; top:12px; width:370px; border-radius:14px; } }
  #row { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button { border:1.5px solid #e3e7ee; background:#fff; color:#1d2530; border-radius:10px; padding:10px 8px; font-size:14px; cursor:pointer; }
  button.on { border-color:#2563eb; background:#eff4ff; font-weight:600; }
  button:disabled { opacity:.45; }
  #info { font-size:13px; min-height:18px; line-height:1.35; }
  #info.err { color:#dc2626; }
  #dem { font-size:13px; display:grid; gap:4px; }
  #dem input { width:100%; }
  #stat, #tl { font-size:12px; color:#6b7686; line-height:1.45; }
</style>
</head>
<body>
<div id="map"></div>
<div id="p">
  <div id="row">
    <button id="bTraf">🚥 Пробки Яндекса</button>
    <button id="bLights">🚦 Светофоры</button>
    <button id="bSel">📍 Выбрать участок</button>
    <button id="bSim" disabled>▶ Симуляция</button>
  </div>
  <div id="info"></div>
  <label id="dem" hidden>Поток: <b id="dv">800</b> авт/ч на полосу
    <input id="d" type="range" min="200" max="1800" step="100" value="800"></label>
  <div id="tl"></div>
  <div id="stat"></div>
</div>

<script>
(function () {
  'use strict';

  // API-ключ Яндекс Карт (тот же, что в yandex.html). Ограничьте его по HTTP Referer: kpblm4ik.github.io
  var YA_KEY = 'ВСТАВЬ_КЛЮЧ_СЮДА';

  // Дороги берутся из основной карты (то же сохранение freegis.v2): [цвет, обводка, ширина-множитель]
  var COL = { asphalt: ['#6b7280', '#374151', 1], gravel: ['#cbd5e1', '#64748b', 1.4], dirt: ['#a16207', '#fde68a', 1.2],
              rail1520: ['#3a3f47', '#ffffff', 1.6], rail750: ['#e53935', '#ffffff', 1] };
  var ROAD_OK = { asphalt: 1, gravel: 1, dirt: 1 };      // симуляция и точки — только на автодорогах
  var VMAX = { asphalt: 3, gravel: 2, dirt: 1 };         // клеток/с (1 клетка = 7,5 м): 81 / 54 / 27 км/ч
  var CELL = 7.5, BIN = 75, MAX_LEN = 5000, SNAP_PX = 25, LIGHT_M = 20, CYCLE = 60, GREEN = 30;

  var $ = function (id) { return document.getElementById(id); };
  var toYa = function (c) { return [c[1], c[0]]; };
  var map, lines = [];

  try {
    var d0 = JSON.parse(localStorage.getItem('freegis.v2') || 'null');
    lines = ((d0 && d0.lines) || []).filter(function (l) { return l && COL[l.kind] && Array.isArray(l.coords) && l.coords.length >= 2; });
  } catch (e) {}

  function info(m, err) { $('info').textContent = m || ''; $('info').className = err ? 'err' : ''; }

  // ---------- Геометрия (метры, локальная плоскость) ----------
  function dist(A, B) {
    var la = (A[1] + B[1]) / 2 * Math.PI / 180;
    return Math.hypot((B[0] - A[0]) * 111320 * Math.cos(la), (B[1] - A[1]) * 110574);
  }
  function xy(c, o) { return [(c[0] - o[0]) * 111320 * Math.cos(o[1] * Math.PI / 180), (c[1] - o[1]) * 110574]; }
  // ближайшая точка ломаной c к точке p: d — расстояние (м), s — расстояние вдоль линии (м), c — точка на линии
  function nearest(c, p) {
    var best = null, s = 0;
    for (var i = 1; i < c.length; i++) {
      var A = c[i - 1], B = c[i], a = xy(A, p), b = xy(B, p), dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
      var t = L2 ? Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / L2)) : 0, len = dist(A, B);
      var d = Math.hypot(a[0] + t * dx, a[1] + t * dy);
      if (!best || d < best.d) best = { d: d, s: s + t * len, c: [A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])] };
      s += len;
    }
    return best;
  }
  // точка p должна лежать на нарисованной автодороге (допуск SNAP_PX пикселей экрана), иначе null
  function snap(p) {
    var th = SNAP_PX * 156543.03 * Math.cos(p[1] * Math.PI / 180) / Math.pow(2, map.getZoom()), best = null;
    lines.forEach(function (l, li) {
      if (!ROAD_OK[l.kind]) return;
      var r = nearest(l.coords, p);
      if (r.d <= th && (!best || r.d < best.d)) best = { li: li, d: r.d, s: r.s, c: r.c };
    });
    return best;
  }
  // часть ломаной от sa до sb метров
  function sub(c, sa, sb) {
    var out = [], s = 0;
    for (var i = 1; i < c.length; i++) {
      var A = c[i - 1], B = c[i], L = dist(A, B), e = s + L;
      if (L > 0 && e > sa && s < sb) {
        var f0 = Math.max(0, (sa - s) / L), f1 = Math.min(1, (sb - s) / L);
        if (!out.length) out.push([A[0] + f0 * (B[0] - A[0]), A[1] + f0 * (B[1] - A[1])]);
        out.push([A[0] + f1 * (B[0] - A[0]), A[1] + f1 * (B[1] - A[1])]);
      }
      s = e;
    }
    return out;
  }
  function pathLen(c) { var s = 0; for (var i = 1; i < c.length; i++) s += dist(c[i - 1], c[i]); return s; }

  // ---------- Карта и дороги ----------
  function pl(c, color, w, extra) {
    var o = { strokeColor: color, strokeWidth: w, strokeOpacity: 1, interactivityModel: 'default#transparent' };
    for (var k in extra) o[k] = extra[k];
    return new ymaps.Polyline(c.map(toYa), {}, o);
  }
  function drawRoads() {
    lines.forEach(function (l) {
      var k = COL[l.kind], w = k[2] * (l.kind === 'asphalt' ? l.lanes : 1) * 3 + 2;
      map.geoObjects.add(pl(l.coords, k[1], w + 3));
      map.geoObjects.add(pl(l.coords, k[0], w));
    });
    if (lines.length) {
      var la = [], lo = [];
      lines.forEach(function (l) { l.coords.forEach(function (c) { lo.push(c[0]); la.push(c[1]); }); });
      map.setBounds([[Math.min.apply(null, la), Math.min.apply(null, lo)], [Math.max.apply(null, la), Math.max.apply(null, lo)]], { checkZoomRange: true, zoomMargin: 60 });
    } else info('Дорог нет: сначала проложите их на основной карте.', true);
  }
  function layout() {
    $('map').style.bottom = (window.innerWidth < 700 ? $('p').offsetHeight : 0) + 'px';
    if (map) map.container.fitToViewport();
  }

  // ---------- Пробки Яндекса в реальном времени ----------
  var tp = null, tOn = false;
  $('bTraf').onclick = function () {
    if (!tp) {
      try {
        tp = new ymaps.traffic.provider.Actual({}, { infoLayerShown: true });
        tp.state.events.add('change', function () {
          var l = tp.state.get('level');
          $('tl').textContent = typeof l === 'number' ? 'Пробки сейчас: ' + l + ' из 10 баллов' : '';
        });
      } catch (e) { info('Слой пробок недоступен: ' + (e && e.message || e), true); return; }
    }
    tOn = !tOn;
    tp.setMap(tOn ? map : null);
    this.classList.toggle('on', tOn);
    if (!tOn) $('tl').textContent = '';
  };

  // ---------- Светофоры (OpenStreetMap, highway=traffic_signals) ----------
  var lights = [], lightObjs = [];
  function loadLights(s, w, n, e, done) {
    var q = '[out:json][timeout:15];node["highway"="traffic_signals"](' + [s, w, n, e].join(',') + ');out;';
    fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        lightObjs.forEach(function (o) { map.geoObjects.remove(o); });
        lightObjs = [];
        lights = (j.elements || []).map(function (x) { return [x.lon, x.lat]; });
        lights.forEach(function (c) {
          var o = new ymaps.Placemark(toYa(c), { hintContent: 'Светофор' }, { preset: 'islands#circleIcon', iconColor: '#ffffff', interactivityModel: 'default#transparent' });
          o.properties.set('iconContent', '🚦');
          map.geoObjects.add(o); lightObjs.push(o);
        });
        done(true);
      })
      .catch(function () { done(false); });
  }
  $('bLights').onclick = function () {
    if (map.getZoom() < 14) { info('Приблизьте карту (масштаб от 14), чтобы загрузить светофоры.', true); return; }
    var b = map.getBounds();
    info('Загружаю светофоры…');
    loadLights(b[0][0], b[0][1], b[1][0], b[1][1], function (ok) {
      info(ok ? 'Светофоров в кадре: ' + lights.length : 'Не удалось загрузить светофоры (сервис OpenStreetMap недоступен).', !ok);
    });
  };

  // ---------- Выбор участка (точки только на дороге) ----------
  var selecting = false, A = null, sec = null, secObjs = [];
  function clearSec() {
    secObjs.forEach(function (o) { map.geoObjects.remove(o); });
    secObjs = []; A = null; sec = null; stopSim(); $('bSim').disabled = true; $('dem').hidden = true; $('stat').textContent = '';
  }
  function addSec(o) { map.geoObjects.add(o); secObjs.push(o); return o; }
  function dot(c, color) { return addSec(new ymaps.Placemark(toYa(c), {}, { preset: 'islands#circleDotIcon', iconColor: color, interactivityModel: 'default#transparent' })); }

  $('bSel').onclick = function () {
    selecting = !selecting;
    this.classList.toggle('on', selecting);
    if (selecting) { clearSec(); info('Тапните первую точку на дороге.'); } else info('');
  };

  function pick(p) {
    var r = snap(p);
    if (!r) { info('Точка вне дороги. Точки можно ставить только на нарисованной автодороге.', true); return; }
    if (!A) { A = r; dot(r.c, '#2563eb'); info('Теперь вторая точка на той же дороге.'); return; }
    if (r.li !== A.li) { info('Обе точки должны быть на одной дороге.', true); return; }
    if (Math.abs(r.s - A.s) < 30) { info('Точки слишком близко: нужно хотя бы 30 м.', true); return; }
    if (Math.abs(r.s - A.s) > MAX_LEN) { info('Участок длиннее ' + MAX_LEN / 1000 + ' км, выберите покороче.', true); return; }
    var l = lines[r.li], path = sub(l.coords, Math.min(A.s, r.s), Math.max(A.s, r.s));
    dot(r.c, '#2563eb');
    addSec(pl(path, '#2563eb', 14, { strokeOpacity: 0.35 }));
    sec = { path: path, len: pathLen(path), kind: l.kind, lanes: l.kind === 'asphalt' ? l.lanes : 1 };
    selecting = false; $('bSel').classList.remove('on');
    $('bSim').disabled = false; $('dem').hidden = false;
    info('Участок ' + Math.round(sec.len) + ' м, полос: ' + sec.lanes + '. Ищу светофоры…');
    var la = sec.path.map(function (c) { return c[1]; }), lo = sec.path.map(function (c) { return c[0]; }), pad = 0.0006;
    loadLights(Math.min.apply(null, la) - pad, Math.min.apply(null, lo) - pad, Math.max.apply(null, la) + pad, Math.max.apply(null, lo) + pad, function (ok) {
      if (!sec) return;
      var n = lightsOn().length;
      info('Участок ' + Math.round(sec.len) + ' м, полос: ' + sec.lanes + (ok ? ', светофоров: ' + n : '. Светофоры не загрузились, симуляция без них.'), !ok);
    });
  }
  function lightsOn() {
    return lights.map(function (c) { var r = nearest(sec.path, c); return r.d <= LIGHT_M ? r.s : -1; }).filter(function (s) { return s >= 0; });
  }

  // ---------- Симуляция пробок (модель Нагеля — Шрекенберга, одна полоса) ----------
  var timer = null, v, n, bins, binPl, lc, t, vmax;
  function stopSim() { if (timer) clearInterval(timer); timer = null; $('bSim').textContent = '▶ Симуляция'; $('bSim').classList.remove('on'); }

  $('d').oninput = function () { $('dv').textContent = this.value; };
  $('bSim').onclick = function () {
    if (timer) { stopSim(); return; }
    n = Math.max(8, Math.round(sec.len / CELL)); v = []; for (var i = 0; i < n; i++) v.push(-1);
    vmax = VMAX[sec.kind]; t = 0;
    var seen = {};
    lc = lightsOn().map(function (s, k) { return { i: Math.min(n - 1, Math.round(s / CELL)), o: k * 17 }; })
      .filter(function (x) { if (seen[x.i]) return false; seen[x.i] = 1; return true; });
    bins = Math.ceil(sec.len / BIN);
    binPl && binPl.forEach(function (o) { map.geoObjects.remove(o); });
    binPl = [];
    for (var b = 0; b < bins; b++) {
      var p = sub(sec.path, b * BIN, Math.min(sec.len, (b + 1) * BIN));
      if (p.length < 2) { binPl.push(null); continue; }
      var o = pl(p, '#16a34a', 7); map.geoObjects.add(o); binPl.push(o);
    }
    this.textContent = '■ Стоп'; this.classList.add('on');
    timer = setInterval(function () { step(); step(); draw(); }, 100);   // ускорение ×20
  };

  function step() {
    t++;
    var red = {}, i, j, k;
    lc.forEach(function (x) { if ((t + x.o) % CYCLE >= GREEN) red[x.i] = 1; });
    var nv = []; for (i = 0; i < n; i++) nv.push(-1);
    for (i = n - 1; i >= 0; i--) {
      if (v[i] < 0) continue;
      var vi = Math.min(v[i] + 1, vmax), ex = false;
      for (j = 1; j <= vi; j++) {
        k = i + j;
        if (k >= n) { ex = true; break; }
        if (v[k] >= 0 || red[k]) { vi = j - 1; break; }
      }
      if (ex) continue;                                  // машина покинула участок
      if (vi > 0 && Math.random() < 0.2) vi--;           // случайное замедление
      nv[i + vi] = vi;
    }
    if (nv[0] < 0 && !red[0] && Math.random() < (+$('d').value) / 3600) nv[0] = Math.min(1, vmax);  // въезд
    v = nv;
  }

  function draw() {
    var sum = [], cnt = [], b, i, tot = 0, all = 0;
    for (b = 0; b < bins; b++) { sum.push(0); cnt.push(0); }
    for (i = 0; i < n; i++) if (v[i] >= 0) {
      b = Math.min(bins - 1, Math.floor(i * CELL / BIN)); sum[b] += v[i]; cnt[b]++; tot += v[i]; all++;
    }
    var jam = 0;
    for (b = 0; b < bins; b++) {
      var r = cnt[b] ? sum[b] / cnt[b] / vmax : 1, col = r > 0.6 ? '#16a34a' : r > 0.3 ? '#f59e0b' : '#dc2626';
      if (col === '#dc2626') jam += BIN;
      if (binPl[b]) binPl[b].options.set('strokeColor', col);
    }
    var kmh = (all ? tot / all : vmax) * CELL * 3.6;
    $('stat').innerHTML = 'Время: ' + Math.floor(t / 60) + ' мин · машин: ' + all + '<br>Средняя скорость: ' + Math.round(kmh) + ' км/ч (максимум ' + Math.round(vmax * CELL * 3.6) +
      ')<br>Пробка (красное): ~' + Math.min(Math.round(jam), Math.round(sec.len)) + ' м · светофоров: ' + lc.length;
  }

  // ---------- Старт ----------
  function init() {
    map = new ymaps.Map('map', { center: [55.75, 37.62], zoom: 10, controls: ['zoomControl'] });
    drawRoads();
    map.events.add('click', function (e) { if (selecting) { var p = e.get('coords'); pick([p[1], p[0]]); } });
    layout();
  }
  window.addEventListener('resize', layout);
  layout();

  if (!YA_KEY || YA_KEY.indexOf('ВСТАВЬ') === 0) { info('Нужен API-ключ Яндекс Карт: впишите его в YA_KEY в начале скрипта.', true); return; }
  var s = document.createElement('script');
  s.src = 'https://api-maps.yandex.ru/2.1/?apikey=' + encodeURIComponent(YA_KEY) + '&lang=ru_RU&load=package.full';
  s.onload = function () { if (window.ymaps) ymaps.ready(init); else info('Яндекс Карты не инициализировались. Проверьте ключ и его ограничения по домену.', true); };
  s.onerror = function () { info('Не удалось загрузить API Яндекс Карт. Проверьте интернет или отключите блокировщики.', true); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
